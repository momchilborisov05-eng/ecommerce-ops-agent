  <script>
    // Theme before first paint: ?theme=light|dark > saved choice > dark (the default showcase).
    (function () {
      var t = null;
      try { t = new URLSearchParams(location.search).get("theme"); } catch (e) {}
      if (t === "light" || t === "dark") { try { localStorage.setItem("opsagent-theme", t); } catch (e) {} }
      else { try { t = localStorage.getItem("opsagent-theme"); } catch (e) { t = null; } }
      if (t !== "light" && t !== "dark") t = "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
